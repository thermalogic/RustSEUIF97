name: Build WASM and Test

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: false
        default: 'wasm32-unknown-unknown'
        type: string

jobs:
  build_wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Build WASM
      run: cargo build --release --features wasm --target wasm32-unknown-unknown

    - name: Install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli

    - name: Generate JS bindings
      run: wasm-bindgen target/wasm32-unknown-unknown/release/seuif97.wasm --out-dir pkg --target web

    - name: Run Rust tests
      run: cargo test --features wasm --verbose

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: seuif97-wasm
        path: |
          pkg/seuif97_bg.wasm
          pkg/seuif97.js
          pkg/seuif97.d.ts
        retention-days: 7

  test_wasi:
    runs-on: ubuntu-latest
    needs: build_wasm
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain with WASI
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-wasi

    - name: Build for WASI
      run: cargo build --release --features wasm --target wasm32-wasi

    - name: Install wasmtime
      run: curl https://wasmtime.dev/install.sh -sSf | bash

    - name: Run WASI tests
      run: wasmtime target/wasm32-wasi/release/seuif97.wasm --help || echo "WASI build successful"