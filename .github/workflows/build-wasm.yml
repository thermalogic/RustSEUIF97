name: Build WASM and Test

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: false
        default: 'wasm32-unknown-unknown'
        type: string

jobs:
  build_wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clear cargo config to use official crates.io
      run: rm -f ~/.cargo/config.toml

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Build WASM
      run: cargo build --release --features wasm --target wasm32-unknown-unknown

    - name: Install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli

    - name: Generate JS bindings
      run: wasm-bindgen target/wasm32-unknown-unknown/release/seuif97.wasm --out-dir pkg --target web

    - name: Run Rust tests
      run: cargo test --features wasm --verbose

    - name: Install wasmtime
      run: curl https://wasmtime.dev/install.sh -sSf | bash

    - name: Test WASM with wasmtime
      run: |
        source $HOME/.wasmtime/env
        wasmtime pkg/seuif97_bg.wasm --invoke pt 16.0 535.1 4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Test WASM in Node.js
      run: |
        node -e "
          const fs = require('fs');
          const wasmBuffer = fs.readFileSync('./pkg/seuif97_bg.wasm');
          console.log('WASM file size:', wasmBuffer.length, 'bytes');
        "

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: seuif97-wasm
        path: |
          pkg/seuif97_bg.wasm
          pkg/seuif97.js
          pkg/seuif97.d.ts
        retention-days: 7