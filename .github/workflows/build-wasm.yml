name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clear cargo config to use official crates.io
      run: rm -f ~/.cargo/config.toml

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Build WASM
      run: cargo build --release --features wasm --target wasm32-unknown-unknown

    - name: Install wasm-bindgen-cli
      run: cargo install wasm-bindgen-cli

    - name: Generate JS bindings
      run: wasm-bindgen target/wasm32-unknown-unknown/release/seuif97.wasm --out-dir pkg --target web

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'

    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
