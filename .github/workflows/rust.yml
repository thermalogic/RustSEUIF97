name: Rust

on:
  push:
    branches: [ "seuif97-pypi-multi-platform" ]
  pull_request:
    branches: [ "seuif97-pypi-multi-platform" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
