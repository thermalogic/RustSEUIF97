name: Publish to PyPI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build_wheels_linux:
    name: Build wheels on Linux x86_64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        args: --release --out dist
        sccache: 'true'
        manylinux: '2014'
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist/*.whl

  build_wheels_windows:
    name: Build wheels on Windows x86_64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        args: --release --out dist
        sccache: 'true'
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows-x86_64
        path: dist/*.whl

  build_wheels_linux_arm:
    name: Build wheels on Linux ARM64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: aarch64-unknown-linux-gnu
        args: --release --out dist
        sccache: 'true'
        manylinux: '2014'
        docker-options: -e CFLAGS="-march=armv8-a"
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-arm64
        path: dist/*.whl

  build_wheels_macos_intel:
    name: Build wheels on macOS Intel (cross-compile)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: x86_64-apple-darwin
        args: --release --out dist
        sccache: 'true'
      env:
        MACOSX_DEPLOYMENT_TARGET: '10.12'
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-intel
        path: dist/*.whl

  build_wheels_macos_arm:
    name: Build wheels on macOS ARM64
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        args: --release --out dist
        sccache: 'true'
      env:
        MACOSX_DEPLOYMENT_TARGET: '11.0'
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-arm64
        path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [test, build_wheels_linux, build_wheels_windows, build_wheels_linux_arm, build_wheels_macos_intel, build_wheels_macos_arm, build_sdist]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts
    - name: Flatten artifacts
      run: |
        mkdir -p dist
        find dist-artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist