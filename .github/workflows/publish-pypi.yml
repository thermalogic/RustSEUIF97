name: Publish to PyPI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build_wheels:
    name: Build wheels on ${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU (for cross-compilation)
      if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install maturin
      run: pip install maturin
    - name: Build wheels
      run: |
        if [ "${{ matrix.target }}" == "aarch64" ]; then
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            maturin build --release --out dist --target aarch64-apple-darwin --find-interpreter
          else
            maturin build --release --out dist --target aarch64-unknown-linux-gnu --zig
          fi
        else
          maturin build --release --out dist
        fi
      shell: bash
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.target }}
        path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install maturin
      run: pip install maturin
    - name: Build sdist
      run: maturin build --release --sdist --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install twine
      run: pip install twine
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        find dist-artifacts -name "*.whl" -o -name "*.tar.gz" | xargs twine upload