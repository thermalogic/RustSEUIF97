[package]
name = "seuif97"
version = "2.3.6"
edition = "2021"
authors = ["Cheng Maohua <cmh@seu.edu.cn>"]
description = "The high-speed IAPWS-IF97 package with C, Python and WASM bindings"
readme = "README.md"
homepage = "https://github.com/thermalogic/"
repository = "https://github.com/thermalogic/RustSEUIF97/"
license = "MIT"
keywords = ["IF97", "IAPWS-IF97"]
categories = ["science"]
exclude = ["/dynamic_lib"]

[lib]
name = "seuif97"
crate-type = ["rlib", "cdylib"]

[features]
cdecl = []
stdcall = []
python = ["pyo3"]
wasm = ["wasm-bindgen"]

[dependencies.pyo3]
version = "0.28.3"
features = ["extension-module", "abi3-py38"]
optional = true

[dependencies.wasm-bindgen]
version = "0.2.100"
optional = true

[dev-dependencies]
assert_approx_eq = "1.1.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
#name = "region_speed"
name="speed_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
target-cpu = "native"  

[package.metadata.maturin]
name = "seuif97"

