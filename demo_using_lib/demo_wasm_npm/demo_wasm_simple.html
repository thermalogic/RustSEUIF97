<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SEUIF97 WASM Demo</title>
</head>
<body>
    <h1>SEUIF97 WASM Demo</h1>
    <pre id="output"></pre>
     <script type="module">
        import init, { pt } from '../../pkg/seuif97.js';
        try {
            await init();
            
            const p = 16.0;   // MPa
            const t = 535.1;  // °C
            const h = pt(p, t, 4);  // 4 kJ/kg

            document.getElementById('output').innerHTML = `
                <strong>Result:</strong><br>
                p = ${p} MPa<br>
                t = ${t} °C<br>
                h = ${h.toFixed(3)} kJ/kg
            `;
            console.log('SEUIF97 WASM ');
            console.log(`h = ${h.toFixed(3)} kJ/kg`);
            
        } catch (e) {
            document.getElementById('output').innerHTML = 
                `<strong style="color:red">错误：</strong>${e.message}`;
            console.error(e);
        }
    </script>
</body>
</html>
